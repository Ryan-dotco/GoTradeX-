<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>GoTradeX Trading</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{overflow-x:hidden}button,input{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.app{min-height:100dvh;background:#07111f}.top{height:72px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;background:#0a1626;position:sticky;top:0;z-index:30}
.profileBtn{display:flex;align-items:center;gap:10px;background:transparent;color:#fff;text-align:left;padding:0}.avatar{width:44px;height:44px;border-radius:50%;background:#1769ff;display:grid;place-items:center;font-weight:900}.who b{display:block;font-size:15px}.who span{display:block;color:#8fa2bb;font-size:11px;margin-top:2px}.walletBtn{background:#12243a;color:#fff;border-radius:12px;padding:8px 11px;text-align:right}.walletBtn small{display:block;color:#86a0bd;font-size:9px}.walletBtn strong{font-size:13px}
.assetbar{height:58px;padding:8px 12px;background:#0a1626;border-top:1px solid #14243a;display:flex;gap:8px;align-items:center;position:relative;z-index:25}.assetBtn,.timeBtn{background:#1769ff;color:#fff;border-radius:10px;padding:11px 12px;font-weight:850}.assetBtn{min-width:92px;text-align:left}.pair{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.timeWrap{margin-left:auto;position:relative}.timeBtn{background:#12243a;min-width:96px}
.menu{position:absolute;z-index:60;background:#0d1c2f;border:1px solid #29415d;border-radius:14px;box-shadow:0 18px 50px #000b}.assetMenu{left:10px;right:10px;top:62px;padding:11px}.assetClasses{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.classBtn,.tf{background:#142940;color:#c9d6e5;border-radius:9px;font-weight:800}.classBtn{padding:10px 4px;font-size:11px}.classBtn.active,.tf.active{background:#1769ff;color:#fff}.pairs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px;max-height:240px;overflow:auto}.pairBtn{background:#0a1626;border:1px solid #20364f;color:#fff;padding:10px;border-radius:9px;text-align:left}.pairBtn small{display:block;color:#7890aa;font-size:10px;margin-top:3px}.timeMenu{right:0;top:50px;width:245px;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tf{padding:10px 4px;font-size:11px}
.chart{height:48dvh;min-height:300px;background:#07111f;position:relative}.chart canvas{display:block;width:100%;height:100%}.quote{position:absolute;left:12px;top:10px;background:#07111fcc;padding:5px 8px;border-radius:6px;font-size:11px}.chartInfo{position:absolute;right:12px;top:10px;color:#7990aa;font-size:10px}
.controls{padding:11px 12px 16px;background:#0a1626}.amount{height:54px;display:flex;align-items:center;gap:8px;background:#12243a;border-radius:11px;padding:8px 11px;margin-bottom:10px}.amount label{font-size:12px;color:#91a5bd}.amount input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:19px;font-weight:900}.trades{display:grid;grid-template-columns:1fr 1fr;gap:9px}.trade{height:58px;border-radius:12px;color:#fff;font-size:18px;font-weight:950}.sell{background:#d9364f}.buy{background:#1769ff}.status{text-align:center;color:#7890aa;font-size:10px;padding-top:8px;min-height:24px}
.screen{position:fixed;inset:0;background:#07111f;z-index:80;overflow:auto}.screenHead{height:64px;background:#0a1626;display:flex;align-items:center;gap:12px;padding:9px 12px;position:sticky;top:0;z-index:2}.back{width:42px;height:42px;border-radius:10px;background:#12243a;color:#fff;font-size:22px}.screenHead h2{font-size:17px;margin:0}.screenBody{padding:16px 14px 30px;max-width:620px;margin:auto}.card{background:#0d1c2f;border:1px solid #20364f;border-radius:14px;padding:15px;margin-bottom:12px}.balance{text-align:center;font-size:28px;font-weight:950;padding:18px}.balance small{display:block;color:#7f95ae;font-size:11px;font-weight:600;margin-bottom:5px}.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{background:#1769ff;color:#fff;border-radius:11px;padding:14px;font-weight:900}.secondary{background:#142940;color:#dce7f4;border-radius:11px;padding:14px;font-weight:900}.danger{background:#d9364f;color:#fff;border-radius:11px;padding:14px;font-weight:900}.field{margin:10px 0}.field label{display:block;color:#91a5bd;font-size:11px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:13px;background:#07111f;border:1px solid #29415d;border-radius:10px;color:#fff;outline:none}.notice{font-size:11px;color:#8499b0;line-height:1.5}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #1d3045;font-size:12px}.row:last-child{border-bottom:0}.order{padding:12px;border:1px solid #20364f;border-radius:10px;margin-top:8px}.order b{font-size:13px}.order small{display:block;color:#8096ae;margin-top:4px}
.auth{position:fixed;inset:0;background:#07111f;z-index:100;display:grid;place-items:center;padding:18px}.authBox{width:min(420px,100%);background:#0d1c2f;border:1px solid #29415d;border-radius:18px;padding:20px}.authBox h1{margin:0 0 4px;font-size:25px}.authBox p{color:#8297ae;font-size:12px;margin:0 0 18px}.authBox input{width:100%;padding:14px;margin:6px 0;background:#07111f;border:1px solid #29415d;border-radius:10px;color:#fff;outline:none}.authBox button{width:100%;padding:14px;margin-top:8px;border-radius:10px;font-weight:900}.authPrimary{background:#1769ff;color:#fff}.authAlt{background:#142940;color:#dce7f4}.error{color:#ff7184;font-size:11px;min-height:17px;margin-top:6px}
@media(min-width:700px){.app{max-width:760px;margin:auto;box-shadow:0 0 90px #0007}.chart{height:55vh}.screen{max-width:760px;margin:auto}.assetMenu{top:62px}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"><div class="authBox"><h1>GoTradeX</h1><p>Secure account access for your trading dashboard.</p><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><input id="authName" class="hidden" type="text" placeholder="Full name"><div id="authError" class="error"></div><button id="authSubmit" class="authPrimary">Log In</button><button id="authSwitch" class="authAlt">Create Account</button></div></div>
<div id="app" class="app hidden">
<header class="top"><button id="profileBtn" class="profileBtn"><div id="avatar" class="avatar">GT</div><div class="who"><b id="profileName">Trader</b><span id="profileEmail">Account</span></div></button><button id="walletBtn" class="walletBtn"><small>Wallet</small><strong id="walletBalance">$0.00</strong></button></header>
<section class="assetbar"><button id="assetBtn" class="assetBtn">Assets ▾</button><div id="pairName" class="pair">BTC / USD</div><div class="timeWrap"><button id="timeBtn" class="timeBtn">1 Minute ▾</button><div id="timeMenu" class="menu timeMenu hidden"></div></div></section>
<div id="assetMenu" class="menu assetMenu hidden"><div id="assetClasses" class="assetClasses"></div><div id="pairs" class="pairs"></div></div>
<main><div class="chart"><canvas id="chart"></canvas><div id="quote" class="quote">BTC / USD</div><div id="chartInfo" class="chartInfo">DEMO MARKET</div></div><section class="controls"><div class="amount"><label>Amount</label><span>$</span><input id="amount" type="number" min="1" step="1" value="10"></div><div class="trades"><button id="sell" class="trade sell">SELL</button><button id="buy" class="trade buy">BUY</button></div><div id="status" class="status"></div></section></main></div>

<div id="profileScreen" class="screen hidden"><div class="screenHead"><button class="back" data-close="profileScreen">‹</button><h2>Profile</h2></div><div class="screenBody"><div class="card"><div class="balance"><small>TRADING ACCOUNT</small><span id="profileBalance">$0.00</span></div><div class="row"><span>Name</span><b id="profileFullName">Trader</b></div><div class="row"><span>Email</span><b id="profileFullEmail">-</b></div></div><div class="card"><div class="field"><label>Display name</label><input id="editName" maxlength="80"></div><button id="saveProfile" class="primary">Save Profile</button></div><div class="card"><button id="logout" class="danger">Log Out</button></div></div></div>

<div id="walletScreen" class="screen hidden"><div class="screenHead"><button class="back" data-close="walletScreen">‹</button><h2>Wallet</h2></div><div class="screenBody"><div class="card balance"><small>AVAILABLE BALANCE</small><span id="walletScreenBalance">$0.00</span></div><div class="actionGrid"><button id="openDeposit" class="primary">Deposit</button><button id="openWithdraw" class="secondary">Withdrawal</button></div><div id="walletForm" class="card hidden"><h3 id="walletFormTitle">Deposit</h3><div class="field"><label>Amount</label><input id="walletAmount" type="number" min="10" step="0.01" value="10"></div><div id="walletAddressField" class="field hidden"><label>Withdrawal wallet address</label><input id="walletAddress" type="text" placeholder="Enter destination"></div><p id="walletFormNote" class="notice"></p><button id="submitWallet" class="primary">Submit Request</button><div id="walletMessage" class="status"></div></div><div class="card"><h3>Recent wallet requests</h3><div id="walletHistory" class="notice">Loading…</div></div></div></div>

<div id="tradeScreen" class="screen hidden"><div class="screenHead"><button class="back" data-close="tradeScreen">‹</button><h2>Order History</h2></div><div class="screenBody"><div class="card"><div id="tradeHistory" class="notice">Loading…</div></div></div></div>

<script>
const SUPABASE_URL='https://glffecggusetzklmyukv.supabase.co';
const SUPABASE_KEY='sb_publishable_I5HYnrxveFXIrvj0NvL1eA_GHIWEDe5';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ASSETS={
Forex:[['EURUSD','EUR / USD',1.0821],['GBPUSD','GBP / USD',1.263],['USDJPY','USD / JPY',149.2],['USDZAR','USD / ZAR',17.85],['AUDUSD','AUD / USD',.655],['USDCAD','USD / CAD',1.357]],
Indices:[['US500','US 500',5520],['NAS100','NAS 100',19420],['US30','US 30',41400],['GER40','GER 40',18750],['UK100','UK 100',8320],['SA40','SA 40',76000]],
Commodities:[['WTIUSD','WTI Oil',72.4],['BRENTUSD','Brent Oil',76.8],['NATGASUSD','Natural Gas',2.65],['COPPERUSD','Copper',4.12]],
Metals:[['XAUUSD','Gold / USD',2650],['XAGUSD','Silver / USD',31.2],['XPTUSD','Platinum / USD',990],['XPDUSD','Palladium / USD',1010]],
Crypto:[['BTCUSDT','BTC / USD',64231.5],['ETHUSDT','ETH / USD',3450.2],['BNBUSDT','BNB / USD',590],['SOLUSDT','SOL / USD',148],['XRPUSDT','XRP / USD',.61],['DOGEUSDT','DOGE / USD',.12]]
};
const TIMES=['5 Seconds','15 Seconds','30 Seconds','1 Minute','2 Minutes','5 Minutes','15 Minutes','30 Minutes','1 Hour','4 Hours','1 Day','1 Week'];
let category='Crypto',selected=ASSETS.Crypto[0],time='1 Minute',currentUser=null,wallet=null,walletMode='deposit';
const $=id=>document.getElementById(id);
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function initials(name){return (name||'Trader').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'GT'}
function showScreen(id){$(id).classList.remove('hidden');history.pushState({screen:id},'','#'+id)}
function closeScreen(id,back=true){$(id).classList.add('hidden');if(back&&location.hash==='#'+id)history.back()}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeScreen(b.dataset.close));
window.addEventListener('popstate',()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));if(location.hash.startsWith('#')){$(location.hash.slice(1))?.classList.remove('hidden')}});

function renderClasses(){ $('assetClasses').innerHTML=Object.keys(ASSETS).map(c=>'<button class="classBtn '+(c===category?'active':'')+'" data-c="'+c+'">'+c+'</button>').join('');$('pairs').innerHTML=ASSETS[category].map(p=>'<button class="pairBtn" data-p="'+p[0]+'"><b>'+p[1]+'</b><small>'+p[0]+'</small></button>').join('')}
function renderTimes(){$('timeMenu').innerHTML=TIMES.map(t=>'<button class="tf '+(t===time?'active':'')+'" data-t="'+t+'">'+t+'</button>').join('')}
function updateAsset(){$('pairName').textContent=selected[1];$('quote').textContent=selected[1];draw();saveSettings()}
renderClasses();renderTimes();
$('assetBtn').onclick=e=>{e.stopPropagation();$('assetMenu').classList.toggle('hidden');$('timeMenu').classList.add('hidden')};
$('timeBtn').onclick=e=>{e.stopPropagation();$('timeMenu').classList.toggle('hidden');$('assetMenu').classList.add('hidden')};
document.addEventListener('click',e=>{if(!e.target.closest('.assetbar')&&!e.target.closest('.assetMenu')){$('assetMenu').classList.add('hidden');$('timeMenu').classList.add('hidden')}});
$('assetClasses').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;category=b.dataset.c;renderClasses()};
$('pairs').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;selected=Object.values(ASSETS).flat().find(p=>p[0]===b.dataset.p)||selected;updateAsset();$('assetMenu').classList.add('hidden')};
$('timeMenu').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;time=b.dataset.t;$('timeBtn').textContent=time+' ▾';renderTimes();$('timeMenu').classList.add('hidden');draw();saveSettings()};

async function saveSettings(){if(!currentUser)return;await sb.from('gotradex_dashboard_ui_settings').upsert({user_id:currentUser.id,selected_symbol:selected[0],timeframe:time,chart_style:'candles'},{onConflict:'user_id'})}
async function loadSettings(){if(!currentUser)return;const {data}=await sb.from('gotradex_dashboard_ui_settings').select('*').eq('user_id',currentUser.id).maybeSingle();if(data){const p=Object.values(ASSETS).flat().find(x=>x[0]===data.selected_symbol);if(p)selected=p; if(TIMES.includes(data.timeframe))time=data.timeframe;$('timeBtn').textContent=time+' ▾';renderTimes();updateAsset()}}

async function loadAccount(){
const {data:{user}}=await sb.auth.getUser();currentUser=user;if(!user){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}
$('auth').classList.add('hidden');$('app').classList.remove('hidden');
let {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
if(!p){const name=user.user_metadata?.full_name||user.email?.split('@')[0]||'Trader';await sb.from('profiles').insert({id:user.id,email:user.email,full_name:name});p={full_name:name,email:user.email}}
$('profileName').textContent=p.full_name||'Trader';$('profileEmail').textContent=user.email||'';$('avatar').textContent=initials(p.full_name);$('profileFullName').textContent=p.full_name||'Trader';$('profileFullEmail').textContent=user.email||'-';$('editName').value=p.full_name||'';
const {data:w}=await sb.from('gotradex_wallets').select('*').eq('user_id',user.id).maybeSingle();wallet=w||{capital_balance:0,profit_available:0};refreshWallet();
await loadSettings();await loadWalletHistory();await loadTradeHistory()
}
function refreshWallet(){const b=Number(wallet?.capital_balance||0)+Number(wallet?.profit_available||0);$('walletBalance').textContent=money(b);$('walletScreenBalance').textContent=money(b);$('profileBalance').textContent=money(b)}
async function loadWalletHistory(){if(!currentUser)return;const [d,w]=await Promise.all([sb.from('gotradex_deposits').select('amount,status,requested_at').eq('user_id',currentUser.id).order('requested_at',{ascending:false}).limit(5),sb.from('gotradex_withdrawals').select('amount,net_amount,status,requested_at').eq('user_id',currentUser.id).order('requested_at',{ascending:false}).limit(5)]);const rows=[...(d.data||[]).map(x=>({t:'Deposit',a:x.amount,s:x.status,d:x.requested_at})),...(w.data||[]).map(x=>({t:'Withdrawal',a:x.amount,s:x.status,d:x.requested_at}))].sort((a,b)=>new Date(b.d)-new Date(a.d));$('walletHistory').innerHTML=rows.length?rows.map(x=>'<div class="row"><span>'+x.t+' · '+money(x.a)+'</span><b>'+x.s+'</b></div>').join(''):'No wallet requests yet.'}
async function loadTradeHistory(){if(!currentUser)return;const {data}=await sb.from('gotradex_trades').select('asset,direction,total_allocated,result,opened_at').eq('created_by',currentUser.id).order('opened_at',{ascending:false}).limit(10);$('tradeHistory').innerHTML=data?.length?data.map(x=>'<div class="order"><b>'+x.direction.toUpperCase()+' · '+x.asset+'</b><small>'+money(x.total_allocated)+' · '+x.result+' · '+new Date(x.opened_at).toLocaleString()+'</small></div>').join(''):'No orders yet.'}

$('profileBtn').onclick=()=>showScreen('profileScreen');$('walletBtn').onclick=()=>showScreen('walletScreen');
$('openDeposit').onclick=()=>openWalletForm('deposit');$('openWithdraw').onclick=()=>openWalletForm('withdraw');
function openWalletForm(mode){walletMode=mode;$('walletForm').classList.remove('hidden');$('walletFormTitle').textContent=mode==='deposit'?'Deposit':'Withdrawal';$('walletAddressField').classList.toggle('hidden',mode!=='withdraw');$('walletFormNote').textContent=mode==='deposit'?'Submit a deposit request. The balance changes only after an authorised approval.':'Submit a withdrawal request. Minimum withdrawal is $10; requests are processed after review.';$('walletMessage').textContent=''}
$('submitWallet').onclick=async()=>{if(!currentUser)return;const amount=Number($('walletAmount').value);if(!Number.isFinite(amount)||amount<10){$('walletMessage').textContent='Minimum amount is $10.';return}$('submitWallet').disabled=true;let r;if(walletMode==='deposit'){r=await sb.from('gotradex_deposits').insert({user_id:currentUser.id,amount,payment_method:'manual',status:'pending'})}else{const addr=$('walletAddress').value.trim();if(!addr){$('walletMessage').textContent='Enter a withdrawal destination.';$('submitWallet').disabled=false;return}r=await sb.from('gotradex_withdrawals').insert({user_id:currentUser.id,amount,fee:0,net_amount:amount,wallet_address:addr,status:'pending'})}$('submitWallet').disabled=false;$('walletMessage').textContent=r.error?'Request failed: '+r.error.message:'Request submitted successfully.';if(!r.error)loadWalletHistory()}

$('saveProfile').onclick=async()=>{const name=$('editName').value.trim();if(!name)return;const {error}=await sb.from('profiles').update({full_name:name,updated_at:new Date().toISOString()}).eq('id',currentUser.id);if(!error){$('profileName').textContent=name;$('profileFullName').textContent=name;$('avatar').textContent=initials(name);$('status').textContent='Profile saved'}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.hash='';location.reload()};
async function trade(side){const amount=Math.max(1,Number($('amount').value)||10);if(!currentUser){$('status').textContent='Please log in first';return}const {error}=await sb.from('gotradex_trades').insert({asset:selected[0],direction:side.toLowerCase(),total_allocated:amount,result:'open',created_by:currentUser.id,metadata:{source:'web_dashboard',timeframe:time}});if(error){$('status').textContent='Order could not be recorded: '+error.message;return}$('status').textContent=side+' order recorded · '+money(amount)+' · '+selected[1]+' · '+time;await loadTradeHistory()}
$('sell').onclick=()=>trade('SELL');$('buy').onclick=()=>trade('BUY');

$('authSwitch').onclick=()=>{const signup=$('authName').classList.toggle('hidden');$('authSubmit').textContent=signup?'Create Account':'Log In';$('authSwitch').textContent=signup?'Back to Login':'Create Account';$('authError').textContent=''};
$('authSubmit').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value,name=$('authName').value.trim();$('authError').textContent='';if(!email||password.length<6){$('authError').textContent='Enter a valid email and a password of at least 6 characters.';return}let r;if($('authName').classList.contains('hidden'))r=await sb.auth.signInWithPassword({email,password});else r=await sb.auth.signUp({email,password,options:{data:{full_name:name||email.split('@')[0]}}});if(r.error){$('authError').textContent=r.error.message;return}if(r.data.session)loadAccount();else $('authError').textContent='Account created. Check your email if confirmation is required.'};
sb.auth.onAuthStateChange((_e)=>loadAccount());

function draw(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(!r.width||!r.height)return;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height;x.clearRect(0,0,w,h);x.fillStyle='#07111f';x.fillRect(0,0,w,h);x.strokeStyle='#1d344c';x.setLineDash([3,5]);for(let j=1;j<5;j++){const y=h*j/5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}x.setLineDash([]);let seed=selected[2]*.00001+time.length;const n=Math.ceil(w/10)+2;for(let i=0;i<n;i++){seed=(seed*9301+49297)%233280;const q=seed/233280,base=h*.5+Math.sin(i*.18)*h*.12,close=base+(q-.5)*h*.16,open=close+(q-.5)*16,high=Math.min(h-10,Math.max(open,close)+7+q*13),low=Math.max(10,Math.min(open,close)-7+(1-q)*10),xx=i*10+5;x.strokeStyle='#38536e';x.beginPath();x.moveTo(xx,high);x.lineTo(xx,low);x.stroke();x.fillStyle=close>=open?'#18c98b':'#e34b61';x.fillRect(xx-3,Math.min(open,close),6,Math.max(3,Math.abs(close-open)))}}
new ResizeObserver(draw).observe($('chart'));window.addEventListener('resize',draw);
loadAccount();
</script>
</body></html>
