<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>GoTradeX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07111f;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100dvh;background:#07111f;display:flex;flex-direction:column}
.top{padding:12px 14px 10px;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#0a1626}
.profile{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:42px;height:42px;border-radius:50%;background:#1769ff;display:grid;place-items:center;font-weight:800}.who{min-width:0}.who b{display:block;font-size:15px}.who span{font-size:11px;color:#8fa2bb}
.wallet{background:#12243a;color:#fff;border-radius:11px;padding:10px 12px;font-weight:700}.wallet small{display:block;color:#7e96b4;font-size:9px}.wallet strong{font-size:13px}
.icon{width:42px;height:42px;border-radius:11px;background:#12243a;color:#fff;font-size:18px}
.assetbar{padding:9px 14px;background:#0a1626;border-top:1px solid #14243a;display:flex;gap:8px;align-items:center}
.assetbtn{background:#1769ff;color:#fff;border-radius:10px;padding:11px 13px;font-weight:800;min-width:108px;text-align:left}.pair{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;z-index:20;background:#0d1c2f;border:1px solid #233a56;border-radius:14px;box-shadow:0 16px 40px #0008}.assetmenu{left:12px;right:12px;top:112px;padding:12px}.assetclasses{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.classbtn{background:#142940;color:#b9c8da;padding:10px 5px;border-radius:9px;font-size:11px;font-weight:800}.classbtn.active{background:#1769ff;color:#fff}.pairs{margin-top:9px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:220px;overflow:auto}.pairbtn{padding:10px;background:#0a1626;color:#e9eef6;border:1px solid #20364f;border-radius:9px;text-align:left}.pairbtn small{display:block;color:#7890aa;margin-top:2px}
.time{margin-left:auto;position:relative}.timebtn{background:#12243a;color:#fff;border-radius:10px;padding:11px 10px;font-weight:800;min-width:95px}.timemenu{right:0;top:48px;padding:10px;width:230px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tf{background:#142940;color:#dbe6f4;padding:11px 5px;border-radius:9px;font-weight:800}.tf.active{background:#1769ff;color:#fff}
.chart{height:46vh;min-height:270px;background:#07111f;position:relative}.chart canvas{display:block;width:100%;height:100%}.quote{position:absolute;left:14px;top:10px;background:#07111fcc;padding:5px 8px;border-radius:7px;font-size:12px}.controls{padding:12px 14px 18px;background:#0a1626}.amount{display:flex;align-items:center;gap:8px;background:#12243a;border-radius:11px;padding:8px 11px;margin-bottom:10px}.amount label{font-size:12px;color:#91a5bd}.amount input{width:100%;background:transparent;border:0;outline:0;color:#fff;font-size:18px;font-weight:800}.trades{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trade{padding:16px 10px;border-radius:12px;color:#fff;font-size:18px;font-weight:900}.sell{background:#d9364f}.buy{background:#1769ff}.status{text-align:center;color:#70869f;font-size:10px;padding-top:9px}
.modalback{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.modal{background:#0d1c2f;border:1px solid #29415d;border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:520px;margin:auto}.modal h3{margin:0 0 12px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal button{padding:13px;border-radius:10px;background:#1769ff;color:#fff;font-weight:800}.close{background:#142940!important}.field{margin:10px 0;background:#12243a;border-radius:10px;padding:10px}.field input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:17px}.hidden{display:none!important}
@media(min-width:700px){.app{max-width:720px;margin:auto;box-shadow:0 0 80px #0005}.chart{height:52vh}.assetmenu{top:112px}.modalback{align-items:center}.modal{border-radius:18px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="profile"><div class="avatar">GT</div><div class="who"><b>Trader</b><span>Demo trading account</span></div></div>
 <button class="wallet" id="walletBtn">▣ <small>Wallet</small><strong>$10,000.00</strong></button>
 <button class="icon" id="refreshBtn">↻</button>
</header>
<section class="assetbar">
 <button class="assetbtn" id="assetBtn">Assets ▾</button>
 <div class="pair" id="pairName">BTC / USD</div>
 <div class="time"><button class="timebtn" id="timeBtn">1 Minute ▾</button><div class="menu timemenu hidden" id="timeMenu"></div></div>
</section>
<div class="menu assetmenu hidden" id="assetMenu">
 <div class="assetclasses" id="classes"></div><div class="pairs" id="pairs"></div>
</div>
<main>
 <div class="chart"><canvas id="chart"></canvas><div class="quote" id="quote">BTC / USD · Demo</div></div>
 <section class="controls">
  <div class="amount"><label>Amount</label><span>$</span><input id="amount" type="number" min="1" step="1" value="10"></div>
  <div class="trades"><button class="trade sell" id="sell">SELL</button><button class="trade buy" id="buy">BUY</button></div>
  <div class="status" id="status">Demo market · Paper trading only</div>
 </section>
</main>
</div>
<div class="modalback" id="walletModal"><div class="modal">
 <h3>Wallet</h3><div class="field"><input id="walletAmount" type="number" min="1" value="100"></div>
 <div class="modalgrid"><button id="deposit">Deposit</button><button id="withdraw">Withdrawal</button><button class="close" id="closeWallet">Close</button></div>
 <div class="status">Wallet actions are demo-only in this fresh build.</div>
</div></div>
<script>
const ASSETS={
Forex:[['EURUSD','EUR / USD',1.0821],['GBPUSD','GBP / USD',1.2630],['USDJPY','USD / JPY',149.2],['USDZAR','USD / ZAR',17.85],['AUDUSD','AUD / USD',0.655],['USDCAD','USD / CAD',1.357]],
Indices:[['US500','US 500',5520],['NAS100','NAS 100',19420],['US30','US 30',41400],['GER40','GER 40',18750],['UK100','UK 100',8320],['SA40','SA 40',76000]],
Commodities:[['WTIUSD','WTI Oil',72.4],['BRENTUSD','Brent Oil',76.8],['NATGASUSD','Natural Gas',2.65],['COPPERUSD','Copper',4.12]],
Metals:[['XAUUSD','Gold / USD',2650],['XAGUSD','Silver / USD',31.2],['XPTUSD','Platinum / USD',990],['XPDUSD','Palladium / USD',1010]],
Crypto:[['BTCUSDT','BTC / USD',64231.5],['ETHUSDT','ETH / USD',3450.2],['BNBUSDT','BNB / USD',590],['SOLUSDT','SOL / USD',148],['XRPUSDT','XRP / USD',0.61],['DOGEUSDT','DOGE / USD',0.12]]
};
const TIMES=['5 Seconds','15 Seconds','30 Seconds','1 Minute','2 Minutes','5 Minutes','15 Minutes','30 Minutes','1 Hour','4 Hours','1 Day','1 Week'];
let category='Crypto',selected=ASSETS.Crypto[0],time='1 Minute';
const $=id=>document.getElementById(id);
const assetMenu=$('assetMenu'),timeMenu=$('timeMenu');
function renderClasses(){ $('classes').innerHTML=Object.keys(ASSETS).map(c=>'<button class="classbtn '+(c===category?'active':'')+'" data-c="'+c+'">'+c+'</button>').join(''); $('pairs').innerHTML=ASSETS[category].map(p=>'<button class="pairbtn" data-p="'+p[0]+'"><b>'+p[1]+'</b><small>'+p[0]+'</small></button>').join(''); }
function renderTimes(){timeMenu.innerHTML=TIMES.map(t=>'<button class="tf '+(t===time?'active':'')+'" data-t="'+t+'">'+t+'</button>').join('');}
renderClasses();renderTimes();
$('assetBtn').onclick=()=>{assetMenu.classList.toggle('hidden');timeMenu.classList.add('hidden')};
$('timeBtn').onclick=()=>{timeMenu.classList.toggle('hidden');assetMenu.classList.add('hidden')};
$('classes').onclick=e=>{let b=e.target.closest('[data-c]');if(!b)return;category=b.dataset.c;renderClasses()};
$('pairs').onclick=e=>{let b=e.target.closest('[data-p]');if(!b)return;selected=Object.values(ASSETS).flat().find(p=>p[0]===b.dataset.p)||selected;updateAsset();assetMenu.classList.add('hidden')};
timeMenu.onclick=e=>{let b=e.target.closest('[data-t]');if(!b)return;time=b.dataset.t;$('timeBtn').textContent=time+' ▾';renderTimes();timeMenu.classList.add('hidden');draw()};
function updateAsset(){$('pairName').textContent=selected[1];$('quote').textContent=selected[1]+' · Demo';draw()}
$('walletBtn').onclick=()=>{$('walletModal').style.display='flex'};$('closeWallet').onclick=()=>{$('walletModal').style.display='none'};
$('deposit').onclick=()=>{$('status').textContent='Demo deposit recorded: $'+Number($('walletAmount').value||0).toFixed(2)};
$('withdraw').onclick=()=>{$('status').textContent='Demo withdrawal requested: $'+Number($('walletAmount').value||0).toFixed(2)};
$('refreshBtn').onclick=()=>{draw();$('status').textContent='Demo market refreshed'};
$('sell').onclick=()=>trade('SELL');$('buy').onclick=()=>trade('BUY');
function trade(side){let a=Math.max(1,Number($('amount').value)||10);$('status').textContent=side+' order opened · $'+a.toFixed(2)+' · '+selected[1]+' · '+time}
function draw(){
 const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height;
 x.clearRect(0,0,w,h);x.fillStyle='#07111f';x.fillRect(0,0,w,h);
 const step=11, n=Math.ceil(w/step)+2, base=h*.48, amp=Math.max(35,h*.20);let seed=selected[2]*.00001;
 for(let i=0;i<n;i++){seed=(seed*9301+49297)%233280;let q=seed/233280;let wave=Math.sin(i*.34+selected[2])*.22+Math.sin(i*.09)*.16;let close=base+(q-.5)*amp+wave*amp;let open=close+(q-.5)*18;let high=Math.min(h-10,Math.max(open,close)+8+q*16);let low=Math.max(10,Math.min(open,close)-8+(1-q)*10);let xx=i*step+4;
   x.strokeStyle='#35506c';x.beginPath();x.moveTo(xx,high);x.lineTo(xx,low);x.stroke();x.fillStyle=close>=open?'#18c98b':'#e34b61';x.fillRect(xx-3,Math.min(open,close),6,Math.max(3,Math.abs(close-open)));
 }
 x.strokeStyle='#263d57';x.setLineDash([3,5]);for(let j=1;j<5;j++){let y=h*j/5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}x.setLineDash([]);
}
new ResizeObserver(draw).observe($('chart'));updateAsset();
</script>
</body></html>
