<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoTradeX — Deriv LIVE FX Batch 4</title><style>body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;padding:18px}button{padding:12px;margin:4px;border-radius:8px;border:0}pre{white-space:pre-wrap;background:#050814;padding:12px;border-radius:10px} .ok{color:#4ade80}.bad{color:#fb7185}</style></head><body><h2>GoTradeX — Deriv LIVE FX Batch 4</h2><p>Isolated test only. Main production is not changed.</p><div id="pairs"></div><button onclick="testAll()">TEST ALL 26</button><button onclick="log.textContent=''">CLEAR</button><pre id="log"></pre><script>
const WS="wss://api.derivws.com/trading/v1/options/ws/public";
const pairs=["EUR/CAD","EUR/NZD","GBP/CAD","GBP/CHF","GBP/NZD","CAD/CHF","AUD/CHF","USD/SGD","USD/HKD","EUR/ZAR","GBP/ZAR","USD/MXN","USD/TRY","USD/NOK","USD/SEK","USD/DKK","EUR/NOK","EUR/SEK","EUR/PLN","EUR/TRY","GBP/SGD","NZD/CAD","USD/INR","USD/BRL","USD/CNH","USD/IDR"];
const map=Object.fromEntries(pairs.map(x=>[x,"frx"+x.replace("/","")]));
const log=document.getElementById("log"),box=document.getElementById("pairs");
pairs.forEach((p,i)=>{const b=document.createElement("button");b.textContent=p;b.onclick=()=>testPair(p);box.appendChild(b)});
function out(s){log.textContent+=s+"\n";log.scrollTop=log.scrollHeight}
function testPair(pair){return new Promise((resolve)=>{const ws=new WebSocket(WS),sym=map[pair];let hist=false,ticks=0,done=false,timer=setTimeout(()=>finish(),8000);function finish(){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch(_){}out((hist&&ticks>0?"[PASS] ":"[CHECK] ")+pair+" • "+(hist?"history":"no history")+" • ticks "+ticks);resolve({pair,hist,ticks})}ws.onopen=()=>{out("[WS] "+pair+" connected • "+sym);ws.send(JSON.stringify({ticks_history:sym,end:"latest",count:20,granularity:60,style:"candles",req_id:1}));ws.send(JSON.stringify({ticks:sym,subscribe:1,req_id:2}))};ws.onerror=()=>finish();ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.error){out("[ERROR] "+pair+" • "+d.error.code+" "+d.error.message);finish();return}if(d.msg_type==="candles"&&Array.isArray(d.candles)&&d.candles.length){hist=true}if(d.msg_type==="tick"&&d.tick){ticks++;if(ticks>=2)finish()}}catch(_){}}})}
async function testAll(){log.textContent="[BATCH 4] Testing 26 remaining Forex candidates...\n";let pass=0;for(const p of pairs){const r=await testPair(p);if(r.hist&&r.ticks>0)pass++;await new Promise(x=>setTimeout(x,300))}out("\nRESULT: "+pass+"/"+pairs.length+" passed history + live tick test.");}
</script></body></html>
