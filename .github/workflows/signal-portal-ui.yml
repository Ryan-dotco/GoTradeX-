name: Signal Portal UI Repair

on:
  push:
    branches: [signal-portal-development]
    paths: ['.github/workflows/signal-portal-ui.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize and commit Signal Analyzer UI
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'signal-portal-development';
            const path = 'script.js';

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let code = Buffer.from(file.data.content, 'base64').toString('utf8');
            const marker = '/* SIGNAL_PORTAL_UI_V1 */';

            if (!code.includes(marker)) {
              core.setFailed('Signal Portal UI marker not found. No file was changed.');
              return;
            }

            const [head, tail] = code.split(marker);
            const normalized = head + marker + tail.replace(/\\\\n/g, '\n');

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Normalize Signal Analyzer UI code',
              content: Buffer.from(normalized, 'utf8').toString('base64'),
              sha: file.data.sha,
              branch
            });

      - name: Verify JavaScript syntax
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'signal-portal-development';
            const path = 'script.js';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const code = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!code.includes('/* SIGNAL_PORTAL_UI_V1 */')) core.setFailed('Signal Portal UI marker missing after repair.');
            core.info('Signal Portal UI code is present on the development branch.');
