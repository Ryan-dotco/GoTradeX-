name: Repair GoTradeX Login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair login-blocking JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          broken = '''async /* =========================================================
             GOTRADEX OWN TRADING CHART
             Candles + Heikin-Ashi + volume + EMA + RSI + crosshair.
             ========================================================= */

          function chartPriceLabel'''
          fixed = '''/* =========================================================
             GOTRADEX OWN TRADING CHART
             Candles + Heikin-Ashi + volume + EMA + RSI + crosshair.
             ========================================================= */

          function chartPriceLabel'''
          changed = False

          if broken in s:
              s = s.replace(broken, fixed, 1)
              changed = True

          duplicate = '    const toggle = box?.parentElement?.querySelector(".chart-control-toggle");'
          duplicate_fixed = '    const timeframeToggle = box?.parentElement?.querySelector(".chart-control-toggle");'
          if duplicate in s:
              s = s.replace(duplicate, duplicate_fixed, 1)
              s = s.replace('    toggle?.setAttribute("aria-expanded", "false");', '    timeframeToggle?.setAttribute("aria-expanded", "false");', 1)
              changed = True

          s = s.replace('const APP_VERSION = "3.0.29";', 'const APP_VERSION = "3.0.30";')
          if 'script.js?v=3.0.29' in Path('index.html').read_text(encoding='utf-8'):
              index = Path('index.html').read_text(encoding='utf-8').replace('script.js?v=3.0.29', 'script.js?v=3.0.30')
              Path('index.html').write_text(index, encoding='utf-8')
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('Login repair already applied.')
          PY

      - name: Commit repair if needed
        shell: bash
        run: |
          git config user.name "GoTradeX Repair Bot"
          git config user.email "actions@github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "No repair commit needed."
          else
            git commit -m "Repair login blocking JavaScript syntax"
            git push
          fi
