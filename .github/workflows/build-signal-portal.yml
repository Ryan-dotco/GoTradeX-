name: Build Signal Portal UI
on:
  push:
    branches:
      - signal-portal-development
    paths:
      - .github/workflows/build-signal-portal.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize Signal Analyzer UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* SIGNAL_PORTAL_UI_V1 */'
          if marker not in s:
              raise SystemExit('Signal Portal UI marker not found')
          head, tail = s.split(marker, 1)
          tail = tail.replace('\\n', '\n')
          p.write_text(head + marker + tail, encoding='utf-8')
          PY
      - name: Verify JavaScript
        run: node --check script.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Normalize Signal Analyzer UI code" || exit 0
          git push
