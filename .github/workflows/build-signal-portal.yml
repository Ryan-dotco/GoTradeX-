name: Build Signal Portal UI
on:
  push:
    branches:
      - signal-portal-development
    paths:
      - .github/workflows/build-signal-portal.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add visible Signal Analyzer fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* SIGNAL_PORTAL_UI_V1 */'
          if marker in s:
              print('Signal Portal UI already applied.')
              raise SystemExit(0)
          addition = r'''\n\n/* SIGNAL_PORTAL_UI_V1 */\n(function enhanceSignalPortalUI() {\n  function populateSignalAssets() {\n    const select = document.getElementById('signalAsset');\n    if (!select || typeof marketCatalog !== 'object') return;\n    const previous = select.value || 'BTCUSDT';\n    const groups = [\n      ['crypto', 'Crypto'],\n      ['forex', 'Forex'],\n      ['commodities', 'Commodities'],\n      ['indices', 'Indices'],\n      ['metals', 'Metals']\n    ];\n    const frag = document.createDocumentFragment();\n    groups.forEach(([key, label]) => {\n      const items = Array.isArray(marketCatalog[key]) ? marketCatalog[key] : [];\n      if (!items.length) return;\n      const group = document.createElement('optgroup');\n      group.label = label;\n      items.forEach(item => {\n        const option = document.createElement('option');\n        option.value = item[0];\n        option.textContent = item[1] || item[0];\n        group.appendChild(option);\n      });\n      frag.appendChild(group);\n    });\n    if (frag.childNodes.length) {\n      select.replaceChildren(frag);\n      select.value = Array.from(select.options).some(o => o.value === previous) ? previous : 'BTCUSDT';\n    }\n  }\n\n  function ensureResultFields() {\n    const result = document.querySelector('#page-signals .analyzer-result');\n    if (!result || document.getElementById('analysisTradeLevels')) return;\n    const grid = document.createElement('div');\n    grid.id = 'analysisTradeLevels';\n    grid.className = 'analysis-grid';\n    grid.innerHTML = `\n      <div><span>Entry</span><strong id="analysisEntry">—</strong></div>\n      <div><span>Take Profit</span><strong id="analysisTarget">—</strong></div>\n      <div><span>Stop Loss</span><strong id="analysisStop">—</strong></div>\n      <div><span>Pattern</span><strong id="analysisPattern">—</strong></div>\n      <div><span>Timeframe</span><strong id="analysisTimeframe">—</strong></div>\n      <div><span>Asset</span><strong id="analysisAssetName">—</strong></div>`;\n    result.appendChild(grid);\n  }\n\n  function formatLevel(value) {\n    return value == null || value === '' || !Number.isFinite(Number(value)) ? '—' : '$' + formatPrice(Number(value));\n  }\n\n  function syncVisibleSignal(signal) {\n    if (!signal) return;\n    ensureResultFields();\n    const symbol = signal.symbol || document.getElementById('signalAsset')?.value || 'BTCUSDT';\n    const assetOption = document.querySelector(`#signalAsset option[value="${CSS.escape(symbol)}"]`);\n    const timeframe = state.currentTimeframe || '1H';\n    const values = {\n      analysisEntry: formatLevel(signal.entry),\n      analysisTarget: formatLevel(signal.target),\n      analysisStop: formatLevel(signal.stop),\n      analysisPattern: signal.pattern || 'None',\n      analysisTimeframe: timeframe,\n      analysisAssetName: assetOption?.textContent || symbol\n    };\n    Object.entries(values).forEach(([id, value]) => {\n      const el = document.getElementById(id);\n      if (el) el.textContent = value;\n    });\n  }\n\n  function watchAnalyzer() {\n    const button = document.getElementById('analyzeButton');\n    if (!button || button.dataset.signalUiBound) return;\n    button.dataset.signalUiBound = '1';\n    button.addEventListener('click', () => {\n      ensureResultFields();\n      let tries = 0;\n      const timer = setInterval(() => {\n        tries += 1;\n        const latest = Array.isArray(state.signals) ? state.signals[0] : null;\n        if (latest) syncVisibleSignal(latest);\n        if (latest || tries >= 40) clearInterval(timer);\n      }, 250);\n    });\n  }\n\n  function boot() {\n    populateSignalAssets();\n    ensureResultFields();\n    watchAnalyzer();\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', boot, { once: true });\n  } else {\n    boot();\n  }\n  setTimeout(boot, 500);\n  setTimeout(boot, 1500);\n})();\n'''
          p.write_text(s + addition, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Complete visible Signal Analyzer portal" || exit 0
          git push
