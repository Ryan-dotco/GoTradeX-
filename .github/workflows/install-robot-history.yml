name: Load Robot History Module
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'Install robot history module') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject robot history script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="robot-history.js?v=1.0.0"></script>'
          if tag not in s:
              marker='<script src="script.js?v=3.0.35"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n  '+tag, 1)
              else:
                  s=s.replace('</body>', '  '+tag+'\n</body>', 1)
              p.write_text(s)
          PY
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Install robot history module"
          git push