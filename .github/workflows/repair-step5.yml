name: Repair GoTradeX Step 5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Ryan-dotco' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore last known good script and apply Step 5
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          good = "d68b78bd5bb8e71952101f95b81dea60e2a1e4e7"
          subprocess.run(["git", "fetch", "origin", good, "--depth=1"], check=True)
          subprocess.run(["git", "checkout", good, "--", "script.js"], check=True)

          path = Path("script.js")
          text = path.read_text(encoding="utf-8")

          pattern = r'async function startRobot\(\) \{.*?\n\}\n\n\nasync function stopRobot\(\)'

          replacement = '''async function startRobot() {

  try {

    if (!state.supabase || !state.user) {
      throw new Error("Trading account session is not available.");
    }

    const accountId =
      Number($("mt5AccountId")?.value || state.mt5AccountId);

    if (!Number.isInteger(accountId) || accountId <= 0) {
      throw new Error("Enter your AvaTrade MT5 Account ID first.");
    }

    const allowedRisks = [
      "conservative",
      "moderate",
      "aggressive"
    ];

    if (!allowedRisks.includes(state.robotRisk)) {
      throw new Error("Select a valid risk profile first.");
    }

    const drawdown = Number(state.maxDrawdown);

    if (!Number.isFinite(drawdown) || drawdown <= 0 || drawdown > 100) {
      throw new Error("Maximum drawdown must be between 1% and 100%.");
    }

    if (!isBrokerStatusFresh()) {
      throw new Error(
        "AvaTrade MT5 is not connected or its heartbeat is stale. Connect MT5/VPS before starting LIVE mode."
      );
    }

    state.mt5AccountId = String(accountId);

    await saveRobotControl(true);

    state.robotRunning = true;
    state.lastQueuedSignalKey = "";
    state.lastQueuedAt = 0;

    renderRobotStatus();

    showToast(
      "AutoBot started. AvaTrade MT5/VPS remains responsible for continuous execution.",
      "success"
    );

  } catch (error) {

    console.error("Start robot error:", error);

    state.robotRunning = false;
    renderRobotStatus();

    showToast(
      error.message || "Unable to start the robot.",
      "error"
    );

  }

}


async function stopRobot()'''

          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Step 5 startRobot block was not found; refusing to overwrite script.js")

          path.write_text(updated, encoding="utf-8")

          result = subprocess.run(["node", "--check", "script.js"], capture_output=True, text=True)
          if result.returncode != 0:
              print(result.stdout)
              print(result.stderr)
              raise SystemExit("script.js syntax check failed")

      - name: Commit repaired script
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Step 5: harden AutoBot LIVE start controls" || exit 0
          git push origin HEAD:main

      - name: Remove repair workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-step5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/repair-step5.yml
          git commit -m "Remove temporary Step 5 repair workflow" || exit 0
          git push origin HEAD:main
