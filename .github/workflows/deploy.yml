name: Deploy GoTradeX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Fix chart JavaScript syntax before deployment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("script.js")
          s = p.read_text()
          s = s.replace(
              'async /* =========================================================\n   GOTRADEX OWN TRADING CHART\n   Candles + Heikin-Ashi + volume + EMA + RSI + crosshair.\n   ========================================================= */\n\nfunction chartPriceLabel',
              '/* =========================================================\n   GOTRADEX OWN TRADING CHART\n   Candles + Heikin-Ashi + volume + EMA + RSI + crosshair.\n   ========================================================= */\n\nfunction chartPriceLabel'
          )
          p.write_text(s)
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
