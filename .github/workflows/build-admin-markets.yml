name: Build Admin Markets
on:
  push:
    paths:
      - .github/market-build-trigger
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin Markets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); c=p.read_text()
          assert 'data-admin-section="Trading & Markets"' in c
          assert 'id="adminMarkets"' not in c
          section='''<section class="adminSection" id="adminMarkets"><div class="adminSectionHead"><strong>Trading &amp; Markets</strong><button type="button" id="marketsClose">Close</button></div><div class="adminMarketsToolbar"><input class="adminFilter" id="marketsSearch" type="search" placeholder="Search symbol or market..." autocomplete="off"><select id="marketsCategory"><option value="all">All categories</option><option value="otc_forex">OTC Forex</option><option value="otc_crypto">OTC Crypto</option><option value="otc_metals">OTC Metals</option><option value="otc_indices">OTC Indices</option><option value="otc_commodities">OTC Commodities</option></select></div><div class="adminMarketsNotice"><strong>OTC Markets</strong><span>OTC instruments are managed separately from verified external/live market feeds. Prices must not be presented as live external-market prices unless a verified provider is connected.</span></div><div class="adminMarketsActions"><button class="adminMarketsAction primary" id="marketsRefresh" type="button">Refresh Markets</button><button class="adminMarketsAction" id="marketsEnableAll" type="button">Enable All</button><button class="adminMarketsAction" id="marketsDisableAll" type="button">Disable All</button></div><div class="adminMarketsStatus" id="marketsStatus">Loading market registry...</div><div class="adminMarketsList" id="marketsList"></div><button class="adminBackCard" id="marketsBack" type="button">Back to Admin Portal</button></section>'''
          needle='</section>\n<section class="adminSection" id="adminTransactions">'
          assert needle in c
          c=c.replace(needle,'</section>\n'+section+'\n<section class="adminSection" id="adminTransactions">',1)
          css='''.adminMarketsToolbar{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:10px}.adminMarketsToolbar select{height:40px;background:#102945;color:#fff;border:1px solid #23466d;border-radius:8px;padding:0 10px}.adminMarketsNotice{background:#081b33;border:1px dashed #23466d;border-radius:9px;padding:10px;color:#8fa8c4;font-size:10px;line-height:1.45;margin-bottom:10px}.adminMarketsNotice strong{display:block;color:#fff;margin-bottom:3px}.adminMarketsActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.adminMarketsAction{min-height:40px;border-radius:8px;background:#163554;color:#fff;font-weight:800}.adminMarketsAction.primary{background:#176fca}.adminMarketsStatus{text-align:center;color:#8fa8c4;font-size:10px;min-height:16px;margin:7px 0}.adminMarketsList{display:grid;gap:8px}.adminMarketRow{background:#102945;border:1px solid #23466d;border-radius:10px;padding:10px}.adminMarketTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.adminMarketTop strong{font-size:12px}.adminMarketTop span{color:#8fa8c4;font-size:9px}.adminMarketControls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.adminMarketToggle{min-height:34px;background:#163554;color:#fff;border-radius:7px;font-size:9px;font-weight:800}.adminMarketToggle.on{background:#176fca}.adminMarketMeta{margin-top:7px;color:#8fa8c4;font-size:9px}@media(max-width:520px){.adminMarketsToolbar{grid-template-columns:1fr}.adminMarketsActions{grid-template-columns:1fr}.adminMarketControls{grid-template-columns:1fr 1fr}}'''
          c=c.replace('</style>',css+'</style>',1)
          js='''const ADMIN_MARKETS_KEY="gotradex_admin_markets";const adminMarketDefaults=[{symbol:"OTC_EURUSD",display_name:"EUR/USD OTC",category:"otc_forex",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_GBPUSD",display_name:"GBP/USD OTC",category:"otc_forex",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_USDJPY",display_name:"USD/JPY OTC",category:"otc_forex",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_AUDUSD",display_name:"AUD/USD OTC",category:"otc_forex",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_USDCAD",display_name:"USD/CAD OTC",category:"otc_forex",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_BTCUSD",display_name:"BTC/USD OTC",category:"otc_crypto",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_ETHUSD",display_name:"ETH/USD OTC",category:"otc_crypto",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_XAUUSD",display_name:"Gold (XAU/USD) OTC",category:"otc_metals",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_XAGUSD",display_name:"Silver (XAG/USD) OTC",category:"otc_metals",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_US30",display_name:"US30 OTC",category:"otc_indices",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_NAS100",display_name:"NAS100 OTC",category:"otc_indices",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_SPX500",display_name:"SPX500 OTC",category:"otc_indices",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false},{symbol:"OTC_WTI",display_name:"WTI Oil OTC",category:"otc_commodities",market_type:"OTC",enabled:true,trading_enabled:true,chart_enabled:true,autobot_enabled:false}];function adminMarketsRead(){try{const v=JSON.parse(localStorage.getItem(ADMIN_MARKETS_KEY)||"null");return Array.isArray(v)?v:adminMarketDefaults.map(x=>({...x}))}catch(e){return adminMarketDefaults.map(x=>({...x}))}}function adminMarketsWrite(v){localStorage.setItem(ADMIN_MARKETS_KEY,JSON.stringify(v))}function marketToggleValue(v){return v?"ON":"OFF"}function renderAdminMarkets(){const list=document.getElementById("marketsList"),q=(document.getElementById("marketsSearch").value||"").toLowerCase().trim(),cat=document.getElementById("marketsCategory").value,all=adminMarketsRead();const rows=all.filter(m=>(cat==="all"||m.category===cat)&&(!q||m.symbol.toLowerCase().includes(q)||m.display_name.toLowerCase().includes(q)));list.innerHTML=rows.length?rows.map(m=>{const idx=all.findIndex(x=>x.symbol===m.symbol);return `<div class="adminMarketRow"><div class="adminMarketTop"><strong>${m.display_name}</strong><span>${m.market_type} • ${m.symbol}</span></div><div class="adminMarketMeta">${m.category.replaceAll("_"," ")}</div><div class="adminMarketControls"><button class="adminMarketToggle ${m.enabled?"on":""}" data-market-index="${idx}" data-market-key="enabled" type="button">Visible ${marketToggleValue(m.enabled)}</button><button class="adminMarketToggle ${m.trading_enabled?"on":""}" data-market-index="${idx}" data-market-key="trading_enabled" type="button">Trading ${marketToggleValue(m.trading_enabled)}</button><button class="adminMarketToggle ${m.chart_enabled?"on":""}" data-market-index="${idx}" data-market-key="chart_enabled" type="button">Chart ${marketToggleValue(m.chart_enabled)}</button><button class="adminMarketToggle ${m.autobot_enabled?"on":""}" data-market-index="${idx}" data-market-key="autobot_enabled" type="button">AutoBot ${marketToggleValue(m.autobot_enabled)}</button></div></div>`}).join(""):"<div class=\"adminSlot\"><strong>No markets found</strong>Change the search or category filter.</div>";list.querySelectorAll(".adminMarketToggle").forEach(b=>b.onclick=()=>{const a=adminMarketsRead(),i=Number(b.dataset.marketIndex),k=b.dataset.marketKey;a[i][k]=!a[i][k];adminMarketsWrite(a);renderAdminMarkets()});document.getElementById("marketsStatus").textContent=rows.length+" market(s) shown • "+all.filter(x=>x.enabled).length+" enabled"}function loadAdminMarkets(){const a=adminMarketsRead();adminMarketsWrite(a);renderAdminMarkets()}function setAllMarkets(enabled){const a=adminMarketsRead().map(m=>({...m,enabled}));adminMarketsWrite(a);renderAdminMarkets();document.getElementById("marketsStatus").textContent=(enabled?"All":"No")+" markets set to "+(enabled?"visible":"hidden")+" locally."}document.getElementById("marketsSearch").oninput=renderAdminMarkets;document.getElementById("marketsCategory").onchange=renderAdminMarkets;document.getElementById("marketsRefresh").onclick=loadAdminMarkets;document.getElementById("marketsEnableAll").onclick=()=>setAllMarkets(true);document.getElementById("marketsDisableAll").onclick=()=>setAllMarkets(false);document.getElementById("marketsClose").onclick=e=>{e.preventDefault();e.stopPropagation();closeAdminSection("adminMarkets")};document.getElementById("marketsBack").onclick=e=>{e.preventDefault();e.stopPropagation();closeAdminSection("adminMarkets")};'''
          marker='const ADMIN_FEES_KEY="gotradex_admin_fees";'
          assert marker in c
          c=c.replace(marker,js+marker,1)
          handler='if(section==="Wallet & Transactions"){document.getElementById("adminTransactions").classList.add("open");document.getElementById("adminMessage").textContent="";return}'
          assert handler in c
          c=c.replace(handler,handler+'if(section==="Trading & Markets"){document.getElementById("adminMarkets").classList.add("open");document.getElementById("adminMessage").textContent="";loadAdminMarkets();return}',1)
          p.write_text(c)
      - name: Validate
        run: |
          grep -q 'id="adminMarkets"' index.html
          grep -q 'loadAdminMarkets' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build functional Admin Trading and Markets panel"
          git push
