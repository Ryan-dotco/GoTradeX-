name: Owner approval gate (prototype)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  owner-approval:
    name: owner-approval-gate
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Require SHA-bound owner comment and exact path scope
        uses: actions/github-script@v7
        with:
          script: |
            // Authenticates approval through the owner's GitHub account.
            // This does not independently verify a PIN or protect a compromised account.
            const ownerLogin = 'Ryan-dotco';
            const ownerId = 312410773;
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const eventPr = context.payload.pull_request;
            const pullNumber = eventPr?.number ??
              (issue?.pull_request ? issue.number : null);

            if (!pullNumber) {
              core.setFailed('BLOCKED: event is not an eligible pull request.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber
            });
            if (pr.base.ref !== 'main') {
              core.setFailed('BLOCKED: pull request must target main.');
              return;
            }
            const headSha = pr.head.sha;

            const [comments, files] = await Promise.all([
              github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              }),
              github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              })
            ]);

            const changedPaths = files.map(f => f.filename).sort();
            if (changedPaths.length === 0) {
              core.setFailed('BLOCKED: no changed paths were found.');
              return;
            }

            function parseApproval(body) {
              const lines = String(body || '').split(/\r?\n/).map(s => s.trim());
              const match = /^OWNER-APPROVE ([0-9a-f]{40})$/i.exec(lines[0] || '');
              if (!match || lines[1] !== 'SCOPE:') return null;
              const paths = lines.slice(2).filter(Boolean).map(line => {
                if (!line.startsWith('- ')) return null;
                return line.slice(2).trim();
              });
              if (paths.length === 0 || paths.some(p => !p) || new Set(paths).size !== paths.length) return null;
              return { sha: match[1].toLowerCase(), paths: paths.sort() };
            }

            const approvals = comments
              .filter(c => c.user?.login === ownerLogin && c.user?.id === ownerId)
              .map(c => ({ comment: c, parsed: parseApproval(c.body) }))
              .filter(x => x.parsed && x.parsed.sha === headSha.toLowerCase())
              .sort((a, b) => new Date(b.comment.created_at || 0) - new Date(a.comment.created_at || 0));

            const exactApproval = approvals.find(x =>
              JSON.stringify(x.parsed.paths) === JSON.stringify(changedPaths)
            );

            if (!exactApproval) {
              core.setFailed(
                `BLOCKED: owner approval must name the exact current head ${headSha} and list every changed path exactly under SCOPE.`
              );
              return;
            }

            core.notice(`Owner approval verified for current head ${headSha}.`);
            core.notice(`Approved path count: ${changedPaths.length}; no merge was performed.`);
