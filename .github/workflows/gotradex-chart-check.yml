name: GoTradeX chart and asset-sync checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  chart-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check server trade pricing and settlement
        run: |
          deno check supabase/functions/gotradex-trade-engine/index.ts
          deno check supabase/functions/gotradex-trade-scheduler/index.ts
      - name: Syntax check active chart and feed scripts
        run: |
          node --check live-chart.js
          node --check gotradex-pro-engine.js
          node --check market-data.js
      - name: Verify selected asset reaches the correct chart feed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('index.html', 'utf8');
          const chart = fs.readFileSync('live-chart.js', 'utf8');
          const feed = fs.readFileSync('market-data.js', 'utf8');
          const pro = fs.readFileSync('gotradex-pro-engine.js', 'utf8');
          const tradeEngine = fs.readFileSync('supabase/functions/gotradex-trade-engine/index.ts', 'utf8');
          const tradeScheduler = fs.readFileSync('supabase/functions/gotradex-trade-scheduler/index.ts', 'utf8');
          const checks = [
            [(index.match(/<script\\b[^>]*\\bsrc=[\"'][^\"']*live-chart\\.js(?:\\?[^\"']*)?[\"'][^>]*>/gi) || []).length === 1, 'exactly one active live-chart.js script reference (cache version independent)'],
            [index.includes('function gtxSetBottomAsset(') && index.includes('source:"dashboard-assets"'), 'dashboard selection event'],
            [index.includes('function gtxOtcLabel(pair){return String(pair).replace(/\\s+OTC$/i,"")+" OTC";}'), 'OTC label normalization'],
            [index.includes('function gtxAssetSymbol(label){return String(label).replace(/\\s+OTC$/i,"")'), 'asset symbol normalization'],
            [chart.includes('d.source!=="dashboard-assets"') && chart.includes('setAsset(d.label,d.type,d.mode)'), 'single dashboard-to-chart handoff'],
            [chart.includes('function connectDeriv()') && chart.includes('derivCandleHistory(f.symbol,state.sec)'), 'Deriv historical candle request'],
            [chart.includes('return state.mode==="OTC" ? state.candles.length >= 1 : state.candles.length >= 12') && chart.includes('No usable OTC history returned. Waiting for verified Deriv ticks to build the chart') && chart.includes('const socket=feed().derivSocket(f.symbol') && chart.includes('waiting for the first verified tick to build candles'), 'OTC tick bootstrap when history is sparse or fails'],
            [feed.includes('"US 500":"OTC_SPC"') && feed.includes('function derivCandleHistory(symbol,sec)'), 'verified OTC index mapping and history adapter'],
            [pro.includes('if (d.source === "dashboard-assets")') && pro.includes('state.selectedPair = baseSymbol(d.label || state.selectedPair)'), 'Pro engine mirrors dashboard selection'],
            [tradeEngine.includes('const DERIV_FX:Record<string,string>') && tradeEngine.includes('if(provider==="DERIV") return await derivPrice(providerSymbol)') && tradeEngine.includes('if(DERIV_FX[a]) return {provider:"DERIV",symbol:DERIV_FX[a]}'), 'server trade engine routes verified forex prices to Deriv'],
            [tradeScheduler.includes('if (fx[a]) return { provider:"DERIV", symbol:fx[a] }') && tradeScheduler.includes('if (provider === "DERIV") return await derivPrice(symbol)'), 'server scheduler settles verified forex trades using Deriv']
          ];
          for (const [ok, name] of checks) {
            if (!ok) throw new Error('FAILED: ' + name);
            console.log('PASS: ' + name);
          }
          NODE
