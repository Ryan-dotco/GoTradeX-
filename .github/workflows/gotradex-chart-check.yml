name: GoTradeX chart checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  chart-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check Kengly and Pro Engine
        run: |
          node --check chart-engine.js
          node --check gotradex-pro-engine.js
          node --check market-data.js
      - name: Verify protected chart wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const chart=fs.readFileSync('chart-engine.js','utf8');
          const pro=fs.readFileSync('gotradex-pro-engine.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          for(const x of ['GoTradeXChartEngine','gtxKenglyHost','CandlestickSeries','fetchCandles','boot']) if(!chart.includes(x)) throw new Error('Missing Kengly feature: '+x);
          for(const x of ['GoTradeXProEngine','LIVE_ASSETS','OTC_ASSETS','Alligator','Bollinger Bands']) if(!pro.includes(x)) throw new Error('Missing Pro Engine feature: '+x);
          if(!index.includes('chart-engine.js?v=gtx-kengly-final-20261006')) throw new Error('Kengly engine not wired');
          if(!index.includes('gotradex-pro-engine.js?v=gtx-pro-engine-final-20261006')) throw new Error('Pro Engine not wired');
          if(index.includes('style="display:none!important"></section>')) throw new Error('Hidden chart host remains');
          console.log('GoTradeX protected Kengly + Pro Engine checks passed');
          NODE
