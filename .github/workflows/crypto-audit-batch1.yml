name: GoTradeX crypto audit batch 1
on:
  push:
    branches:
      - test-expiry-portal-date-green-20261021
    paths:
      - ".github/workflows/crypto-audit-batch1.yml"
      - "tools/crypto-audit-batch1.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Run read-only public ticker checks
        run: python tools/crypto-audit-batch1.py
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: gotradex-crypto-audit-batch1
          path: crypto-audit-batch1.csv
          if-no-files-found: error
          retention-days: 14
