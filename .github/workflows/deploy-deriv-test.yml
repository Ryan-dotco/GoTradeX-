name: Verify Deriv LIVE Market Test

on:
  push:
    branches:
      - test-deriv-market-feed-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v6

      - name: Verify standalone Deriv test page
        run: |
          test -s deriv-market-test.html
          grep -q "Deriv LIVE feed diagnostic" deriv-market-test.html
          grep -q "wss://ws.binaryws.com/websockets/v3" deriv-market-test.html

      - name: Publish standalone test link
        run: |
          {
            echo "## Standalone Deriv LIVE Market Test"
            echo
            echo "The production GitHub Pages site was not changed."
            echo
            echo "[Open the isolated Deriv test](https://cdn.jsdelivr.net/gh/Ryan-dotco/GoTradeX-@test-deriv-market-feed-20261008/deriv-market-test.html)"
          } >> "$GITHUB_STEP_SUMMARY"
