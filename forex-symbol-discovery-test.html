<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoTradeX — Deriv Forex Symbol Discovery v3</title>
<style>
body{margin:0;background:#061426;color:#fff;font-family:system-ui,sans-serif;padding:18px}
h1{font-size:20px}.note{color:#9bb1c9;line-height:1.5}.run{background:#176fca;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800}
.grid{display:grid;gap:10px;margin-top:16px}.card{background:#102945;border:1px solid #23466d;border-radius:10px;padding:12px}.name{font-weight:900}.status{margin-top:6px;color:#9bb1c9;font-size:12px}.pass{color:#35d07f}.fail{color:#ff7676}.sym{color:#ffd45a;font-weight:800}
</style></head><body>
<h1>GoTradeX — Deriv Forex Symbol Discovery</h1>
<p class="note">Diagnostic only • CAD/CHF, USD/SGD, USD/HKD, EUR/ZAR, GBP/ZAR, USD/TRY, USD/NOK</p>
<p class="note"><b>Purpose:</b> discover Deriv's actual active symbol before testing candles/ticks. No GoTradeX customer-facing LIVE assets are changed.</p>
<button class="run" id="run">Discover Deriv symbols</button>
<div id="summary" class="note"></div><div id="grid" class="grid"></div>
<script>
const wanted=["CAD/CHF","USD/SGD","USD/HKD","EUR/ZAR","GBP/ZAR","USD/TRY","USD/NOK"];
const WS="wss://api.derivws.com/trading/v1/options/ws/public";
function card(label){const d=document.createElement("div");d.className="card";d.innerHTML='<div class="name">'+label+'</div><div class="status">Waiting…</div>';document.getElementById("grid").appendChild(d);return d.querySelector(".status")}
function discover(){
 return new Promise((resolve,reject)=>{
  let ws,done=false,timer;
  const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);try{ws&&ws.close()}catch(e){}fn(v)};
  try{ws=new WebSocket(WS)}catch(e){return reject(e)}
  timer=setTimeout(()=>finish(reject,new Error("Deriv symbol discovery timed out after 12s.")),12000);
  ws.onopen=()=>ws.send(JSON.stringify({active_symbols:"brief",req_id:7}));
  ws.onerror=()=>finish(reject,new Error("Deriv symbol discovery connection failed."));
  ws.onclose=()=>{if(!done)finish(reject,new Error("Deriv symbol discovery connection closed."))};
  ws.onmessage=e=>{try{
   const d=JSON.parse(e.data);
   if(d.error)return finish(reject,new Error(d.error.message||"Deriv symbol discovery failed."));
   if(d.msg_type==="active_symbols"&&Array.isArray(d.active_symbols))finish(resolve,d.active_symbols);
  }catch(e){}};
 });
}
function normalize(v){return String(v||"").replace(/\\u002F/g,"/").trim().toUpperCase()}
function symbolOf(x){return String(x.underlying_symbol||x.symbol||"")}
function nameOf(x){return String(x.underlying_symbol_name||x.display_name||"")}
document.getElementById("run").onclick=async()=>{
 const btn=document.getElementById("run");btn.disabled=true;document.getElementById("grid").innerHTML="";
 wanted.forEach(card);
 try{
  const list=await discover(); let found=0;
  wanted.forEach((pair,i)=>{
   const status=document.getElementById("grid").children[i].querySelector(".status");
   const exact=list.find(x=>normalize(nameOf(x))===pair.toUpperCase());
   if(exact){found++;status.className="status pass";status.innerHTML='FOUND • <span class="sym">'+symbolOf(exact)+'</span> • '+nameOf(exact)+" • "+String(exact.market||"")+" / "+String(exact.submarket||exact.subgroup||"");}
   else{
    const compact=pair.replace("/","");
    const candidates=list.filter(x=>{const n=normalize(nameOf(x)),s=symbolOf(x).toUpperCase();return n.includes(compact)||s.includes(compact)||(n.includes(pair.split("/")[0])&&n.includes(pair.split("/")[1]));}).slice(0,8);
    status.className="status fail";
    status.textContent=candidates.length?"No exact match. Candidates: "+candidates.map(x=>symbolOf(x)+" ("+nameOf(x)+")").join(", "):"NO EXACT MATCH in Deriv active_symbols.";
   }
  });
  document.getElementById("summary").textContent=found+" / "+wanted.length+" exact display-name matches found from "+list.length+" Deriv active symbols. No assets were promoted.";
 }catch(e){document.getElementById("summary").className="note fail";document.getElementById("summary").textContent="DISCOVERY ERROR • "+(e.message||e)}
 btn.disabled=false;
};
</script></body></html>
